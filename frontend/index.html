<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Advertise your business on a live billboard everyone sees at once. No signup: upload your ad, pay, and you are live in seconds. Outbid the current ad or book a guaranteed slot." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <title>Throne · The live ad billboard</title>
    <script src="/theme.js"></script>
    <!-- Preloader styles live here (not in the bundle) so it paints on the very first frame. -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0c020;
        transition: opacity 0.4s ease, visibility 0.4s;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #preloader .mark {
        position: relative;
        display: flex;
        font-family: Outfit, system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(3rem, 12vw, 7.5rem);
        letter-spacing: -0.02em;
        line-height: 1;
        color: #d02020;
        -webkit-text-stroke: 0.06em #121212;
        paint-order: stroke fill;
        text-shadow: 0.06em 0.06em 0 #121212;
      }
      #preloader .mark span {
        display: inline-block;
        animation: preloader-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #preloader .tag {
        position: absolute;
        right: -0.2em;
        top: -0.9em;
        font-size: 0.2em;
        letter-spacing: 0.08em;
        color: #121212;
        -webkit-text-stroke: 0;
        text-shadow: none;
      }
      @keyframes preloader-pop {
        from {
          transform: translateY(0.6em) scale(0.6);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .mark span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading">
      <div class="mark" aria-hidden="true">
        <span style="animation-delay: 0ms">T</span><span style="animation-delay: 60ms">H</span><span style="animation-delay: 120ms">R</span><span style="animation-delay: 180ms">O</span><span style="animation-delay: 240ms">N</span><span style="animation-delay: 300ms">E</span>
        <span class="tag" style="animation-delay: 420ms">LIVE ADS</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
