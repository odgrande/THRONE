# Render Blueprint: STAGING (free tier, $0). A public test deploy with a real
# database, demo payments and no video worker. See DEPLOY-STAGING.md.
#
# For the real launch use deploy/render.production.yaml (copy it over this
# file): paid always-on API, video worker, all safety keys required.

services:
  - type: web
    name: throne-api-staging
    runtime: node
    rootDir: backend
    # Free instances sleep after ~15 min idle; the next visit wakes them (~1 min).
    plan: free
    # Frankfurt is Render's closest region to Nigeria.
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOY_ENV
        value: staging
      - key: NODE_VERSION
        value: "22"
      # Visitor -> Render load balancer -> app (no Cloudflare in front yet).
      - key: TRUST_PROXY
        value: "1"
      # No video worker on the free tier: never queue videos.
      - key: HYPE_MIN_CENTS
        value: "2000000000"
      - key: CORS_ORIGIN
        sync: false # https://<your-project>.pages.dev
      - key: SITE_URL
        sync: false # same as CORS_ORIGIN
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      # Optional on staging; add them later under Environment if you have them:
      # OPENAI_API_KEY, WEB_RISK_API_KEY, TURNSTILE_SECRET_KEY
