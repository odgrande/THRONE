# Render Blueprint: PRODUCTION (paid). Copy this file to the repo root as
# render.yaml for the real launch (render.yaml there is the free staging setup).
# The API only. The frontend deploys to Cloudflare Pages and the database is
# Supabase (see DEPLOY.md and LAUNCH-CHECKLIST.md).
# Keys marked `sync: false` are secrets: Render asks for them when you create
# the Blueprint, and they never live in this file.

services:
  # Public API. Must be an always-on service (not serverless): every viewer
  # holds a live Server-Sent Events connection for the countdown and takeovers.
  - type: web
    name: throne-api
    runtime: node
    rootDir: backend
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Visitor -> Cloudflare -> Render load balancer -> app.
      - key: TRUST_PROXY
        value: "2"
      # The Throne is the free puzzle race; coins are earn-only play money
      # (COIN_PACKS=on would sell coins through Paystack/Flutterwave).
      - key: THRONE_MODE
        value: game
      - key: COIN_PACKS
        value: "off"
      - key: PUBLIC_URL
        sync: false # https://api.yourdomain.com
      - key: SITE_URL
        sync: false # https://yourdomain.com
      - key: CORS_ORIGIN
        sync: false # https://yourdomain.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Nigeria edition: Paystack LIVE secret key (sk_live_...). It also verifies
      # webhooks: Paystack -> Settings -> API Keys & Webhooks -> Webhook URL
      # https://api.yourdomain.com/api/webhooks/paystack
      - key: PAYMENTS_NG
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Global edition (USD): Flutterwave Standard (hosted checkout).
      - key: PAYMENTS_GLOBAL
        value: flutterwave
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      - key: FLUTTERWAVE_WEBHOOK_HASH
        sync: false
      # Stripe is not used (Global pays through Flutterwave). Only if you switch
      # PAYMENTS_GLOBAL=stripe: add STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET.
      # Hype videos are made only for PAID throne takeovers; in game mode the
      # Throne is won for free, so no videos are queued and no worker is needed.
      - key: HYPE_MIN_CENTS
        value: "2000000000"
      - key: OPENAI_API_KEY
        sync: false
      - key: WEB_RISK_API_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true # Render generates a random secret; copy it from the dashboard
      # Cloudflare adds this as the X-Origin-Secret header (Transform Rule).
      # Copy the generated value into that rule, or the API answers 403.
      - key: ORIGIN_SECRET
        generateValue: true
      # Salt for hashing reporter IPs (one report per person per ad).
      - key: IP_HASH_SALT
        generateValue: true

  # Video renderer: only needed with THRONE_MODE=auction (paid takeovers get a
  # hype video). Uncomment it then, and set HYPE_MIN_CENTS back to 2000.
  # Docker image (headless Chrome needs system libraries) and a 2 GB plan.
